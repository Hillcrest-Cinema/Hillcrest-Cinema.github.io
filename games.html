<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hillcrest Cinema | Arcade</title>
    <style>
        :root {
            --bg-black: #050505;
            --card-bg: #121212;
            --accent-red: #ff0000;
            --text-main: #ffffff;
            --text-dim: #cccccc;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #000;
            padding: 25px 5%;
            border-bottom: 3px solid var(--accent-red);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: var(--accent-red);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 1.8rem;
        }

        .nav-link {
            background-color: var(--accent-red);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .container { padding: 0 5% 50px 5%; }
        
        h2 {
            font-size: 1.8rem;
            margin: 40px 0 20px 0;
            color: var(--text-main);
            border-left: 5px solid var(--accent-red);
            padding-left: 15px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid #222;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            border-color: var(--accent-red);
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.3);
        }

        .poster-wrapper {
            width: 100%;
            aspect-ratio: 2/3;
            background: #1a1a1a;
            overflow: hidden;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info { padding: 12px; text-align: center; flex-grow: 1; }
        
        .game-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 10px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn {
            width: 100%;
            background-color: var(--accent-red);
            color: white;
            padding: 8px 0;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        /* MODAL PLAYER */
        .modal {
            display: none; 
            position: fixed;
            z-index: 9999;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
        }

        .modal-content {
            position: relative;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 95%; height: 90vh;
            max-width: 1200px;
            background: #000;
            border: 2px solid var(--accent-red);
        }

        .close-btn {
            position: absolute;
            top: -35px; right: 0;
            color: white; font-size: 18px; cursor: pointer;
            font-weight: bold;
        }

        iframe { width: 100%; height: 100%; border: none; }
        footer { text-align: center; padding: 40px; color: #444; border-top: 1px solid #222; }
    </style>
</head>

<div id="gameModal" class="modal">
    <div class="modal-content">

        <iframe id="gamePlayer" src="" allow="autoplay; fullscreen"></iframe>
    </div>

<footer>&copy; 2026 Hillcrest Cinema | Private Arcade Access</footer>

<script>
    const modal = document.getElementById('gameModal');
    const player = document.getElementById('gamePlayer');

    function openGame(url) {
        modal.style.display = "block";
        player.src = url;
        document.body.style.overflow = "hidden";
    }

    function closeGame() {
        modal.style.display = "none";
        player.src = "";
        document.body.style.overflow = "auto";
    }

    window.onclick = function(event) {
        if (event.target == modal) { closeGame(); }
    }
</script>
